plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'party.qwer.hayulgui.core'
    compileSdk 35
    defaultConfig { minSdk 26 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    sourceSets.main.assets.srcDir(project(':hayulstub').layout.buildDirectory.dir('stub-assets'))
}

dependencies {
    implementation 'com.android.tools.build:apksig:8.8.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'androidx.core:core-ktx:1.16.0'
    // Upstream's JVM tests (core/src/test); run with :hayulcore:testReleaseUnitTest.
    testImplementation 'junit:junit:4.13.2'
}

tasks.configureEach { task ->
    if ((task.name.startsWith('merge') || task.name.startsWith('package')) && task.name.contains('Assets'))
        task.dependsOn(':hayulstub:stubDex')
}
